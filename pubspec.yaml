name: belmiad
description: Offline-first patient health and medication management app.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  pdf: ^3.11.1
  share_plus: ^10.1.2
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  archive: ^4.0.0
  uuid: ^4.5.1
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.10.0
  drift_dev: ^2.30.0
  freezed: ^3.2.0
  json_serializable: ^6.8.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/drug_catalog.sqlite
    - assets/fonts/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
