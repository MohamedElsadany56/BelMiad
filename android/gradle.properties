org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Plugins now support AGP's built-in Kotlin, so the separate Kotlin Gradle
# Plugin is no longer applied by them.
android.builtInKotlin=true
# The Pub cache (C:) and the project (D:) can be on different drives, which
# breaks Kotlin's incremental caches ("different roots"). Plugins are small,
# so non-incremental compilation costs little.
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2G --enable-native-access=ALL-UNNAMED
